    <h2>Pizza rendelés</h2>
    <form>
        <fieldset>
            <legend>
                Személyes adatok
            </legend>
            <label for="nev"> Név:</label><input type="text" name="nev"  id="nev" required placeholder="Gábor">
            <br>
            <label for="email"> Email</label><input type="email" name="email"  id="email" required placeholder="@gmail.hu">
            <label for="tel"> Tel:</label><input type="number" name="tel"  id="tel" required placeholder="06702813281">
            <label for="cim"> Email</label><input type="text" name="cim"  id="cim" required placeholder="valahaol">
        </fieldset>
        <fieldset>
            <legend>
                Rendelés
            </legend>
            <p>Méret</p>
            <input type="radio" name="size" id="small"><label for="small">22cm</label>
            <input type="radio" name="size" id="mid"><label for="mid">32cm</label>
            <input type="radio" name="size" id="big"><label for="big">55cm</label>
        </fieldset>
    </form>
</body>
